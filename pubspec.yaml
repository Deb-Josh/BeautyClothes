name: beauty_clothes
description: "Une application e-commerce de ventes des vêtements"
publish_to: 'https://github.com/Deb-Josh/BeautyClothes.git'
version: 0.0.1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  faker: ^2.2.0
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
